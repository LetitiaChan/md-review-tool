<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD Human Review - ProseMirror Test Container</title>
    <!-- 仅加载编辑器相关样式，用于让坐标计算（coordsAtPos）有真实布局 -->
    <link rel="stylesheet" href="../../webview/css/style.css">
    <link rel="stylesheet" href="../../webview/css/markdown.css">
    <style>
        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        #pmParent {
            width: 800px;
            min-height: 400px;
            border: 1px solid #ccc;
        }
        .ProseMirror {
            min-height: 360px;
            padding: 8px;
            outline: none;
        }
    </style>
</head>
<body>
    <div id="pmParent"></div>

    <!-- Rich Mode 引擎：打包后暴露 globalThis.PM = { createRichEditor } -->
    <script src="../../webview/dist/pm.bundle.js"></script>
    <script>
        // 同步到 window 方便 Playwright 的 page.evaluate 访问
        if (typeof globalThis.PM !== 'undefined') window.PM = globalThis.PM;
    </script>
</body>
</html>
